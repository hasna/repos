name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Publish to npm
        # Auth mechanism (documented per task d8f3d2ed): bun publish reads the
        # NPM_CONFIG_TOKEN environment variable directly for the default
        # registry. It does NOT read NODE_AUTH_TOKEN (an npm/setup-node
        # convention), and writing ~/.npmrc at publish time was proven dead on
        # tag v0.1.33 (run 28740654644): bun 1.3.x still failed with "missing
        # authentication" even with the token expanded into ~/.npmrc. Single
        # mechanism on purpose so the next tag cleanly attributes success.
        # NODE_AUTH_TOKEN is the repo secret holding the live npm publish
        # token (set 2026-07-05; same token that published v0.1.33 locally).
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
